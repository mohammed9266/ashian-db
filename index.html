<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة قطات العشيان</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* Light Grey */
        }
        /* التمرير المخصص للجدول */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        /* تأثيرات التحميل */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #1e3a8a;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            900: '#0f172a', // داكن جداً
                            800: '#1e293b',
                            700: '#334155', // أزرق ملكي / كحلي
                            600: '#1e3a8a', // أزرق الأزرار
                            500: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // الأشخاص الـ 11 المذكورين
        const PEOPLE = [
            'سليمان', 'حامد', 'الساير', 'عبدالرحمن', 'علي', 
            'سلمان', 'الجاسر', 'محمد', 'حسين', 'مشعل', 'خالد'
        ];

        // بيانات تجريبية مبدئية مستوحاة من الملف المذكور
        const INITIAL_DATA = {
            currentMonthName: "الشهر الحالي",
            records: [
                { id: 1, type: "dinner", date: "2023-10-01", description: "دجاج: 2، رز: 4، بيبسي: نعم", totalAmount: 53, attendees: [...PEOPLE] },
                { id: 2, type: "dinner", date: "2023-10-05", description: "دجاج: 3.5، رز: 6، بيبسي: لا", totalAmount: 82, attendees: ['سليمان', 'حامد', 'الساير', 'علي', 'محمد', 'خالد'] },
                { id: 3, type: "payment", date: "2023-10-06", description: "تسديد قطة", person: "حامد", totalAmount: 50 }
            ],
            archives: {}
        };

        // مفتاح التخزين المحلي للإعدادات (فقط لبيانات GitHub، وليس للبيانات نفسها)
        const GITHUB_SETTINGS_KEY = 'ashian_github_settings';

        
        // دالة لتحويل النصوص لدعم اللغة العربية في Base64
        const utf8_to_b64 = (str) => window.btoa(unescape(encodeURIComponent(str)));
        const b64_to_utf8 = (str) => decodeURIComponent(escape(window.atob(str)));

        const githubAPI = {
            async fetchContent(settings) {
                if (!settings.token || !settings.owner || !settings.repo || !settings.path) {
                    throw new Error("بيانات GitHub غير مكتملة");
                }
                const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${settings.path}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${settings.token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                
                if (response.status === 404) return null; // الملف غير موجود بعد
                if (!response.ok) throw new Error("فشل في جلب البيانات من GitHub. تأكد من الـ Token والصلاحيات.");
                
                const data = await response.json();
                const content = b64_to_utf8(data.content);
                return { data: JSON.parse(content), sha: data.sha };
            },

            async updateContent(settings, newContent, sha, message = "تحديث بيانات قطة العشيان") {
                const url = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${settings.path}`;
                const contentBase64 = utf8_to_b64(JSON.stringify(newContent, null, 2));
                
                const body = {
                    message: message,
                    content: contentBase64,
                };
                if (sha) body.sha = sha;

                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${settings.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) throw new Error("فشل في رفع البيانات إلى GitHub.");
                return await response.json();
            }
        };

        
        // رسالة تنبيه مخصصة (بديل لـ alert)
        const MessageBox = ({ isOpen, title, message, type, onClose, onConfirm, confirmText = "موافق", cancelText = "إلغاء" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform transition-all">
                        <div className="flex items-center gap-3 mb-4">
                            {type === 'danger' ? <i className="ph-fill ph-warning-circle text-3xl text-red-500"></i> :
                             type === 'success' ? <i className="ph-fill ph-check-circle text-3xl text-emerald-500"></i> :
                             <i className="ph-fill ph-info text-3xl text-blue-500"></i>}
                            <h3 className="text-lg font-bold text-gray-800">{title}</h3>
                        </div>
                        <p className="text-gray-600 mb-6 leading-relaxed">{message}</p>
                        <div className="flex gap-3">
                            <button onClick={onConfirm || onClose} className={`flex-1 py-2 rounded-xl text-white font-medium transition ${type === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-royal-600 hover:bg-royal-700'}`}>
                                {confirmText}
                            </button>
                            {onConfirm && (
                                <button onClick={onClose} className="flex-1 py-2 rounded-xl bg-gray-100 text-gray-700 font-medium hover:bg-gray-200 transition">
                                    {cancelText}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // بطاقة الرصيد للشخص
        const BalanceCard = ({ name, balance, onPayClick }) => {
            const isCredit = balance > 0;
            const isDebt = balance < 0;
            const amount = Math.abs(balance).toFixed(2);

            return (
                <div className="bg-white rounded-2xl p-4 flex flex-col items-center justify-center shadow-sm border border-gray-100 hover:shadow-md transition relative overflow-hidden">
                    {/* شريط لوني علوي لتوضيح الحالة */}
                    <div className={`absolute top-0 left-0 right-0 h-1 ${isCredit ? 'bg-emerald-500' : isDebt ? 'bg-red-500' : 'bg-gray-300'}`}></div>
                    
                    <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3 mt-2">
                        <i className="ph ph-user text-2xl text-slate-500"></i>
                    </div>
                    <span className="font-bold text-gray-800 mb-2">{name}</span>
                    
                    <div className={`px-3 py-1 rounded-full text-sm font-bold w-full text-center mb-3 ${isCredit ? 'bg-emerald-100 text-emerald-700' : isDebt ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-500'}`}>
                        {balance === 0 ? 'مُصَفَّر' : (isCredit ? `+ ${amount} (له)` : `- ${amount} (عليه)`)}
                    </div>

                    <button 
                        onClick={() => onPayClick(name, isDebt ? amount : 0)} 
                        className="w-full py-1.5 bg-royal-50 hover:bg-royal-100 text-royal-700 font-medium rounded-lg text-sm transition flex items-center justify-center gap-1 border border-royal-200"
                    >
                        <i className="ph-bold ph-hand-coins"></i>
                        دفع القطة
                    </button>
                </div>
            );
        };

        const App = () => {
            // حالة البيانات الأساسية
            const [data, setData] = useState(INITIAL_DATA);
            const [githubSha, setGithubSha] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // حالة الإعدادات
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem(GITHUB_SETTINGS_KEY);
                return saved ? JSON.parse(saved) : { token: '', owner: '', repo: '', path: 'ashian_data.json' };
            });

            // حالات واجهة المستخدم
            const [showSettings, setShowSettings] = useState(false);
            const [showAddForm, setShowAddForm] = useState(false);
            const [selectedArchive, setSelectedArchive] = useState("current");
            
            // حالة نافذة التسديد
            const [paymentForm, setPaymentForm] = useState({ isOpen: false, person: '', amount: '' });

            // حالة الرسائل
            const [msg, setMsg] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });

            const showMessage = (title, message, type = 'info', onConfirm = null) => {
                setMsg({ isOpen: true, title, message, type, onConfirm });
            };

            const closeMessage = () => setMsg(prev => ({ ...prev, isOpen: false }));

            // نموذج إضافة سجل جديد (عشاء)
            const [newRecord, setNewRecord] = useState({
                date: new Date().toISOString().split('T')[0],
                chickenCount: '',
                riceCount: '',
                hasPepsi: false,
                payer: '',
                attendees: [...PEOPLE] // افتراضياً الكل حاضر
            });

            // حساب الإجمالي التلقائي للعشاء
            const calculatedTotal = useMemo(() => {
                const chicken = parseFloat(newRecord.chickenCount) || 0;
                const rice = parseInt(newRecord.riceCount, 10) || 0;
                const pepsi = newRecord.hasPepsi ? 5 : 0;
                return (chicken * 20) + (rice * 2) + pepsi;
            }, [newRecord.chickenCount, newRecord.riceCount, newRecord.hasPepsi]);

            
            // حساب الأرصدة بناءً على السجلات المختارة (الحالية أو الأرشيف)
            const balances = useMemo(() => {
                const currentRecords = selectedArchive === "current" ? data.records : data.archives[selectedArchive] || [];
                const calc = {};
                PEOPLE.forEach(p => calc[p] = { paid: 0, consumed: 0 });

                currentRecords.forEach(rec => {
                    const amount = parseFloat(rec.totalAmount) || 0;
                    
                    if (rec.type === 'payment') {
                        // عملية تسديد: تزيد من رصيد الشخص
                        if (calc[rec.person]) {
                            calc[rec.person].paid += amount;
                        }
                    } else {
                        // عملية عشاء (أو البيانات القديمة): لا نضيف الرصيد للدافع، فقط نخصم من الحضور
                        if (rec.attendees && rec.attendees.length > 0) {
                            const splitAmount = amount / rec.attendees.length;
                            rec.attendees.forEach(attendee => {
                                if (calc[attendee]) {
                                    calc[attendee].consumed += splitAmount;
                                }
                            });
                        }
                    }
                });

                const finalBalances = {};
                PEOPLE.forEach(p => {
                    finalBalances[p] = calc[p].paid - calc[p].consumed;
                });
                return finalBalances;
            }, [data, selectedArchive]);

            // حساب إجمالي المديونيات والأرصدة الإضافية
            const totalDebt = useMemo(() => Object.values(balances).filter(b => b < 0).reduce((acc, val) => acc + Math.abs(val), 0), [balances]);
            const totalCredit = useMemo(() => Object.values(balances).filter(b => b > 0).reduce((acc, val) => acc + val, 0), [balances]);

            // تفصيل الأشخاص الدائنين والمدينين لترتيبهم في المربعات الجديدة
            const { debtors, creditors } = useMemo(() => {
                const debts = [];
                const credits = [];
                Object.entries(balances).forEach(([name, bal]) => {
                    if (bal < 0) debts.push({ name, amount: Math.abs(bal) });
                    else if (bal > 0) credits.push({ name, amount: bal });
                });
                return {
                    // الترتيب التنازلي للمبالغ (الأعلى أولاً)
                    debtors: debts.sort((a, b) => b.amount - a.amount),
                    creditors: credits.sort((a, b) => b.amount - a.amount)
                };
            }, [balances]);

            const syncDataToCloud = async (newData) => {
                if (!settings.token) return; // العمل محلياً إذا لم يكن هناك Token
                setIsSyncing(true);
                try {
                    const res = await githubAPI.updateContent(settings, newData, githubSha);
                    setGithubSha(res.content.sha);
                } catch (error) {
                    showMessage("خطأ في المزامنة", error.message, "danger");
                } finally {
                    setIsSyncing(false);
                }
            };

            const fetchFromCloud = async () => {
                if (!settings.token || !settings.owner || !settings.repo) return;
                setIsSyncing(true);
                try {
                    const result = await githubAPI.fetchContent(settings);
                    if (result && result.data) {
                        setData(result.data);
                        setGithubSha(result.sha);
                        showMessage("نجاح", "تم مزامنة البيانات من مستودع GitHub بنجاح.", "success");
                    } else {
                        showMessage("معلومة", "الملف غير موجود في GitHub. سيتم إنشاؤه عند أول عملية إضافة.", "info");
                    }
                } catch (error) {
                    showMessage("خطأ في الجلب", error.message, "danger");
                } finally {
                    setIsSyncing(false);
                }
            };

            // حفظ إعدادات GitHub
            const saveSettings = (e) => {
                e.preventDefault();
                localStorage.setItem(GITHUB_SETTINGS_KEY, JSON.stringify(settings));
                setShowSettings(false);
                fetchFromCloud();
            };

            
            const handleAddRecord = (e) => {
                e.preventDefault();
                if (calculatedTotal <= 0) {
                    showMessage("تنبيه", "يجب إدخال كميات صحيحة للعشاء.", "danger");
                    return;
                }
                if (!newRecord.payer) {
                    showMessage("تنبيه", "يجب اختيار الشخص المصوت (الدافع) للعشاء.", "danger");
                    return;
                }
                if (newRecord.attendees.length === 0) {
                    showMessage("تنبيه", "يجب اختيار شخص واحد على الأقل من الحضور.", "danger");
                    return;
                }

                // صياغة الوصف التلقائي
                const payerText = `المصوت: ${newRecord.payer}`;
                const chickenText = newRecord.chickenCount ? `دجاج: ${newRecord.chickenCount}` : '';
                const riceText = newRecord.riceCount ? `رز: ${newRecord.riceCount}` : '';
                const pepsiText = newRecord.hasPepsi ? `بيبسي` : '';
                const desc = [payerText, chickenText, riceText, pepsiText].filter(Boolean).join('، ');

                const recordToAdd = {
                    id: Date.now(),
                    type: 'dinner',
                    date: newRecord.date,
                    description: desc || "عشاء غير محدد",
                    totalAmount: calculatedTotal,
                    payer: newRecord.payer,
                    attendees: newRecord.attendees
                };

                const newData = {
                    ...data,
                    records: [recordToAdd, ...data.records]
                };

                setData(newData);
                syncDataToCloud(newData);
                setShowAddForm(false);
                
                // إعادة ضبط النموذج
                setNewRecord({
                    date: new Date().toISOString().split('T')[0],
                    chickenCount: '',
                    riceCount: '',
                    hasPepsi: false,
                    payer: '',
                    attendees: [...PEOPLE]
                });
            };

            // دالة إضافة التسديد
            const handleAddPayment = (e) => {
                e.preventDefault();
                const amount = parseFloat(paymentForm.amount);
                if (!amount || amount <= 0) {
                    showMessage("تنبيه", "الرجاء إدخال مبلغ صحيح أكبر من الصفر.", "danger");
                    return;
                }

                const paymentRecord = {
                    id: Date.now(),
                    type: 'payment',
                    date: new Date().toISOString().split('T')[0],
                    description: "تسديد قطة / رصيد إضافي",
                    person: paymentForm.person,
                    totalAmount: amount
                };

                const newData = {
                    ...data,
                    records: [paymentRecord, ...data.records]
                };

                setData(newData);
                syncDataToCloud(newData);
                setPaymentForm({ isOpen: false, person: '', amount: '' });
                showMessage("تم بنجاح", `تم تسجيل دفعة بقيمة ${amount} ريال لـ ${paymentForm.person}`, "success");
            };

            const toggleAttendee = (person) => {
                setNewRecord(prev => {
                    const attendees = prev.attendees.includes(person)
                        ? prev.attendees.filter(p => p !== person)
                        : [...prev.attendees, person];
                    return { ...prev, attendees };
                });
            };

            const startNewMonth = () => {
                showMessage(
                    "بدء شهر جديد", 
                    "هل أنت متأكد من أرشفة الشهر الحالي وتصفير الحسابات للبدء من جديد؟", 
                    "danger",
                    () => {
                        const monthName = prompt("أدخل اسم الشهر المراد أرشفته (مثال: أكتوبر 2023):", data.currentMonthName || "شهر سابق");
                        if (!monthName) return; // تم الإلغاء

                        const newData = {
                            ...data,
                            archives: {
                                ...data.archives,
                                [monthName]: [...data.records]
                            },
                            records: [],
                            currentMonthName: "شهر جديد"
                        };

                        setData(newData);
                        syncDataToCloud(newData);
                        closeMessage();
                        showMessage("تم بنجاح", `تمت أرشفة البيانات تحت اسم "${monthName}" وبدء حسابات جديدة.`, "success");
                    }
                );
            };

            const deleteRecord = (id) => {
                showMessage("حذف سجل", "هل أنت متأكد من حذف هذه العملية؟ سيؤثر هذا على الأرصدة.", "danger", () => {
                    const newData = {
                        ...data,
                        records: data.records.filter(r => r.id !== id)
                    };
                    setData(newData);
                    syncDataToCloud(newData);
                    closeMessage();
                });
            };

            // دالة تصفير المديونيات للجميع (تسديد جماعي)
            const handlePayAllDues = () => {
                const hasDebts = PEOPLE.some(p => balances[p] < 0);
                if (!hasDebts) {
                    showMessage("تنبيه", "لا توجد مديونيات مستحقة الدفع حالياً.", "info");
                    return;
                }

                showMessage(
                    "تأكيد دفع الجميع", 
                    "هل أنت متأكد أن الجميع قام بدفع ما عليه من مديونيات؟ سيتم تسجيل عمليات تسديد لتصفير جميع المديونيات الحالية.", 
                    "info", 
                    () => {
                        const newRecords = [];
                        const currentDate = new Date().toISOString().split('T')[0];
                        let index = 0;

                        PEOPLE.forEach(person => {
                            if (balances[person] < 0) {
                                const amount = Math.abs(balances[person]);
                                newRecords.push({
                                    id: Date.now() + index, // ضمان عدم تطابق الـ ID
                                    type: 'payment',
                                    date: currentDate,
                                    description: "تسديد جماعي (تصفير مديونية)",
                                    person: person,
                                    totalAmount: amount
                                });
                                index++;
                            }
                        });

                        const newData = {
                            ...data,
                            // إضافة السجلات الجديدة في بداية القائمة
                            records: [...newRecords, ...data.records] 
                        };
                        setData(newData);
                        syncDataToCloud(newData);
                        closeMessage();
                        showMessage("تم بنجاح", `تم تسجيل تسديد لـ ${index} أشخاص وتصفير مديونياتهم بالكامل.`, "success");
                    }
                );
            };

            const activeRecords = selectedArchive === "current" ? data.records : (data.archives[selectedArchive] || []);
            // فلترة السجلات لعرض العشاء فقط في الجدول وعدم إظهار عمليات التسديد
            const dinnerRecords = activeRecords.filter(r => r.type === 'dinner');

            return (
                <div className="min-h-screen flex flex-col pb-20">
                    {/* Header */}
                    <header className="bg-royal-900 text-white p-4 shadow-lg sticky top-0 z-40">
                        <div className="container mx-auto max-w-6xl flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <i className="ph-fill ph-bowl-food text-3xl text-royal-500"></i>
                                <div>
                                    <h1 className="text-xl font-bold tracking-wide">لوحة تحكم العشيان</h1>
                                    <p className="text-xs text-gray-400">مرجع البيانات: بيان العشيان .xlsx</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                {isSyncing && <div className="loader mr-2 border-t-white"></div>}
                                <button onClick={() => setShowSettings(true)} className="p-2 bg-royal-800 rounded-lg hover:bg-royal-700 transition" title="إعدادات GitHub">
                                    <i className="ph ph-cloud-arrow-up text-xl"></i>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto max-w-6xl p-4 flex-1">
                        
                        {/* Control Bar */}
                        <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm mb-6 border border-gray-100">
                            <div className="flex items-center gap-2 w-full md:w-auto">
                                <i className="ph ph-calendar-blank text-gray-500 text-xl"></i>
                                <select 
                                    value={selectedArchive} 
                                    onChange={(e) => setSelectedArchive(e.target.value)}
                                    className="bg-gray-50 border border-gray-200 text-gray-800 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-royal-500 flex-1 md:w-64"
                                >
                                    <option value="current">الشهر الحالي ({data.currentMonthName})</option>
                                    {Object.keys(data.archives).map(month => (
                                        <option key={month} value={month}>أرشيف: {month}</option>
                                    ))}
                                </select>
                            </div>
                            
                            <div className="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                                {selectedArchive === "current" && (
                                    <button 
                                        onClick={startNewMonth}
                                        className="w-full md:w-auto bg-red-50 text-red-600 hover:bg-red-100 font-bold py-2 px-6 rounded-xl transition flex items-center justify-center gap-2 border border-red-200 h-full"
                                    >
                                        <i className="ph-bold ph-archive"></i>
                                        بدء شهر جديد
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* المربعات التفصيلية للمديونيات والأرصدة الإضافية */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            {/* مربع إجمالي وتفاصيل المديونيات */}
                            <div className="bg-white rounded-2xl p-5 border border-red-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 right-0 h-1 bg-red-500"></div>
                                <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                                    <h3 className="text-lg font-bold text-red-700 flex items-center gap-2">
                                        <i className="ph-fill ph-warning-circle text-2xl"></i> إجمالي المديونيات
                                    </h3>
                                    <span className="bg-red-100 text-red-800 font-bold px-3 py-1.5 rounded-lg text-xl">{totalDebt.toFixed(2)} ر.س</span>
                                </div>
                                {debtors.length === 0 ? (
                                    <p className="text-gray-500 text-sm italic text-center py-6">لا توجد مديونيات على أحد حالياً.</p>
                                ) : (
                                    <div className="max-h-52 overflow-y-auto custom-scrollbar pr-2">
                                        <ul className="space-y-2">
                                            {debtors.map(d => (
                                                <li key={d.name} className="flex justify-between items-center text-sm p-2.5 bg-red-50/50 hover:bg-red-50 rounded-lg transition border border-transparent hover:border-red-100">
                                                    <span className="font-medium text-gray-800 flex items-center gap-2">
                                                        <div className="w-7 h-7 rounded-full bg-red-200 text-red-700 flex items-center justify-center text-sm"><i className="ph-fill ph-user"></i></div>
                                                        {d.name}
                                                    </span>
                                                    <span className="font-bold text-red-600">{d.amount.toFixed(2)} ر.س</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>

                            {/* مربع إجمالي وتفاصيل الأرصدة الإضافية (كريدت) */}
                            <div className="bg-white rounded-2xl p-5 border border-emerald-100 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 right-0 h-1 bg-emerald-500"></div>
                                <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                                    <h3 className="text-lg font-bold text-emerald-700 flex items-center gap-2">
                                        <i className="ph-fill ph-wallet text-2xl"></i> الأرصدة الإضافية (كريدت)
                                    </h3>
                                    <span className="bg-emerald-100 text-emerald-800 font-bold px-3 py-1.5 rounded-lg text-xl">{totalCredit.toFixed(2)} ر.س</span>
                                </div>
                                {creditors.length === 0 ? (
                                    <p className="text-gray-500 text-sm italic text-center py-6">لا توجد أرصدة إضافية لأحد حالياً.</p>
                                ) : (
                                    <div className="max-h-52 overflow-y-auto custom-scrollbar pr-2">
                                        <ul className="space-y-2">
                                            {creditors.map(c => (
                                                <li key={c.name} className="flex justify-between items-center text-sm p-2.5 bg-emerald-50/50 hover:bg-emerald-50 rounded-lg transition border border-transparent hover:border-emerald-100">
                                                    <span className="font-medium text-gray-800 flex items-center gap-2">
                                                        <div className="w-7 h-7 rounded-full bg-emerald-200 text-emerald-700 flex items-center justify-center text-sm"><i className="ph-fill ph-user"></i></div>
                                                        {c.name}
                                                    </span>
                                                    <span className="font-bold text-emerald-600">{c.amount.toFixed(2)} ر.س</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Balances Grid */}
                        <div className="mb-2 flex items-center gap-2">
                            <i className="ph-fill ph-wallet text-xl text-royal-600"></i>
                            <h2 className="text-xl font-bold text-gray-800">ملخص الأرصدة</h2>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-8">
                            {PEOPLE.map(person => (
                                <BalanceCard 
                                    key={person} 
                                    name={person} 
                                    balance={balances[person]} 
                                    onPayClick={(name, defaultAmount) => setPaymentForm({ isOpen: true, person: name, amount: defaultAmount > 0 ? defaultAmount : '' })}
                                />
                            ))}
                        </div>

                        {/* زر تسديد القطة من الجميع */}
                        {selectedArchive === "current" && (
                            <div className="flex justify-center mb-8">
                                <button 
                                    onClick={handlePayAllDues}
                                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl transition shadow-md flex items-center gap-3 border border-emerald-500"
                                >
                                    <i className="ph-fill ph-check-circle text-2xl"></i>
                                    تم دفع القطة من الجميع (تصفير المديونيات)
                                </button>
                            </div>
                        )}

                        {/* Records Section */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                            <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                    <i className="ph-fill ph-list-dashes text-royal-600"></i>
                                    سجل العمليات
                                </h2>
                                {selectedArchive === "current" && (
                                    <button 
                                        onClick={() => setShowAddForm(true)}
                                        className="bg-royal-600 hover:bg-royal-700 text-white font-bold py-2 px-4 rounded-xl transition flex items-center gap-2 shadow-sm"
                                    >
                                        <i className="ph-bold ph-plus"></i>
                                        إضافة عشاء
                                    </button>
                                )}
                            </div>
                            
                            <div className="overflow-x-auto custom-scrollbar">
                                <table className="w-full text-right min-w-[800px]">
                                    <thead className="bg-gray-50 text-gray-600 border-b border-gray-200">
                                        <tr>
                                            <th className="p-4 font-semibold">م</th>
                                            <th className="p-4 font-semibold">التاريخ</th>
                                            <th className="p-4 font-semibold">النوع / الوصف</th>
                                            <th className="p-4 font-semibold">المبلغ الإجمالي</th>
                                            <th className="p-4 font-semibold w-1/3">التفاصيل (الحضور)</th>
                                            {selectedArchive === "current" && <th className="p-4 font-semibold text-center">إجراء</th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {dinnerRecords.length === 0 ? (
                                            <tr>
                                                <td colSpan="6" className="p-8 text-center text-gray-500">
                                                    <i className="ph ph-empty text-4xl mb-2 text-gray-300"></i>
                                                    <p>لا توجد سجلات عشاء لعرضها في هذا الشهر.</p>
                                                </td>
                                            </tr>
                                        ) : dinnerRecords.map((record, index) => (
                                            <tr key={record.id} className="hover:bg-gray-50/50 transition">
                                                <td className="p-4 text-gray-500">{index + 1}</td>
                                                <td className="p-4 text-gray-700">{record.date}</td>
                                                <td className="p-4 font-medium text-gray-900">
                                                    <span className="flex items-center gap-2"><i className="ph-fill ph-bowl-food text-royal-500"></i> {record.description}</span>
                                                </td>
                                                <td className="p-4 font-bold text-gray-800">{record.totalAmount} ريال</td>
                                                <td className="p-4 text-sm text-gray-600 leading-relaxed">
                                                    {record.attendees && record.attendees.length === PEOPLE.length 
                                                        ? <span className="text-royal-600 font-medium">الجميع ({record.attendees.length})</span> 
                                                        : (record.attendees ? record.attendees.join('، ') : '')}
                                                    <br/>
                                                    <span className="text-xs text-gray-400 mt-1 block">نصيب الفرد: {record.attendees ? (record.totalAmount / record.attendees.length).toFixed(2) : 0} ريال</span>
                                                </td>
                                                {selectedArchive === "current" && (
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => deleteRecord(record.id)} className="text-red-400 hover:text-red-600 p-2 bg-red-50 hover:bg-red-100 rounded-lg transition" title="حذف">
                                                            <i className="ph-bold ph-trash"></i>
                                                        </button>
                                                    </td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {}
                    
                    {/* نافذة الإضافة */}
                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm overflow-y-auto">
                            <div className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 my-8">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                        <i className="ph-fill ph-plus-circle text-royal-600"></i>
                                        إضافة عشاء جديد (حساب تلقائي)
                                    </h3>
                                    <button onClick={() => setShowAddForm(false)} className="text-gray-400 hover:text-gray-600">
                                        <i className="ph-bold ph-x text-2xl"></i>
                                    </button>
                                </div>
                                
                                <form onSubmit={handleAddRecord} className="space-y-5">
                                    {/* الحسبة التلقائية */}
                                    <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 mb-4">
                                        <h4 className="text-sm font-bold text-blue-800 mb-3 flex items-center gap-2"><i className="ph-fill ph-calculator"></i> تفاصيل الطلب والحساب</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label className="block text-gray-700 text-sm font-medium mb-2">كم حبة دجاج؟ (تقبل أنصاف)</label>
                                                <div className="relative">
                                                    <input type="number" step="0.5" min="0" placeholder="مثال: 1.5" value={newRecord.chickenCount} onChange={e => setNewRecord({...newRecord, chickenCount: e.target.value})} className="w-full border border-gray-300 rounded-xl pl-4 pr-10 py-2.5 focus:ring-2 focus:ring-royal-500 focus:outline-none" />
                                                    <span className="absolute left-3 top-3 text-gray-400 text-sm">× 20 ر.س</span>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-gray-700 text-sm font-medium mb-2">كم كوب رز؟ (أرقام صحيحة)</label>
                                                <div className="relative">
                                                    <input type="number" step="1" min="0" placeholder="مثال: 4" value={newRecord.riceCount} onChange={e => setNewRecord({...newRecord, riceCount: e.target.value})} className="w-full border border-gray-300 rounded-xl pl-4 pr-10 py-2.5 focus:ring-2 focus:ring-royal-500 focus:outline-none" />
                                                    <span className="absolute left-3 top-3 text-gray-400 text-sm">× 2 ر.س</span>
                                                </div>
                                            </div>
                                            <div className="flex flex-col justify-end pb-1">
                                                <label className="flex items-center gap-3 p-3 border border-gray-300 rounded-xl cursor-pointer hover:bg-gray-50 transition">
                                                    <input type="checkbox" checked={newRecord.hasPepsi} onChange={e => setNewRecord({...newRecord, hasPepsi: e.target.checked})} className="w-5 h-5 text-royal-600 rounded focus:ring-royal-500" />
                                                    <div>
                                                        <span className="block text-gray-800 font-medium">إضافة بيبسي</span>
                                                        <span className="block text-xs text-gray-500">(+ 5 ر.س)</span>
                                                    </div>
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-5 items-center">
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">تاريخ العشاء</label>
                                            <input type="date" required value={newRecord.date} onChange={e => setNewRecord({...newRecord, date: e.target.value})} className="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-royal-500 focus:outline-none" />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-gray-700 font-medium mb-2">المصوت (الدافع)</label>
                                            <select value={newRecord.payer} onChange={e => setNewRecord({...newRecord, payer: e.target.value})} className="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-royal-500 focus:outline-none">
                                                <option value="" disabled>اختر المصوت...</option>
                                                {PEOPLE.map(person => (
                                                    <option key={person} value={person}>{person}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="bg-gray-800 text-white p-4 rounded-xl flex justify-between items-center h-full md:col-span-2">
                                            <span className="text-gray-300 font-medium">الإجمالي المحسوب:</span>
                                            <span className="text-2xl font-bold text-emerald-400">{calculatedTotal.toFixed(2)} ر.س</span>
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <div className="flex justify-between items-end mb-3">
                                            <label className="block text-gray-700 font-medium">من حضر العشاء؟ (يُقسم عليهم المبلغ بالتساوي)</label>
                                            <button type="button" onClick={() => setNewRecord({...newRecord, attendees: [...PEOPLE]})} className="text-sm text-royal-600 hover:underline">تحديد الكل</button>
                                        </div>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200">
                                            {PEOPLE.map(person => (
                                                <label key={person} className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer transition ${newRecord.attendees.includes(person) ? 'bg-royal-50 border border-royal-200' : 'hover:bg-gray-100 border border-transparent'}`}>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={newRecord.attendees.includes(person)}
                                                        onChange={() => toggleAttendee(person)}
                                                        className="w-4 h-4 text-royal-600 rounded focus:ring-royal-500"
                                                    />
                                                    <span className="text-gray-800">{person}</span>
                                                </label>
                                            ))}
                                        </div>
                                        <p className="text-xs text-gray-500 mt-2">نصيب الفرد من الحضور: {newRecord.attendees.length ? (calculatedTotal / newRecord.attendees.length).toFixed(2) : 0} ريال.</p>
                                    </div>

                                    <div className="pt-4 flex gap-3">
                                        <button type="submit" disabled={calculatedTotal === 0} className="flex-1 bg-royal-600 hover:bg-royal-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition shadow-md">
                                            حفظ العشاء
                                        </button>
                                        <button type="button" onClick={() => setShowAddForm(false)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl transition">
                                            إلغاء
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* نافذة تسديد المبالغ */}
                    {paymentForm.isOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform transition-all">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                        <i className="ph-fill ph-hand-coins text-emerald-500"></i>
                                        تسديد مبلغ
                                    </h3>
                                    <button onClick={() => setPaymentForm({ isOpen: false, person: '', amount: '' })} className="text-gray-400 hover:text-gray-600">
                                        <i className="ph-bold ph-x text-xl"></i>
                                    </button>
                                </div>
                                <p className="text-gray-600 mb-4 text-sm">أدخل المبلغ الذي قام بسداده <span className="font-bold text-royal-700">{paymentForm.person}</span> لإضافته إلى رصيده أو خصمه من مديونيته.</p>
                                
                                <form onSubmit={handleAddPayment}>
                                    <div className="mb-5">
                                        <label className="block text-gray-700 font-medium mb-2 text-sm">المبلغ المُسدَّد (ر.س)</label>
                                        <input 
                                            type="number" 
                                            step="0.01" 
                                            min="0.1" 
                                            required 
                                            value={paymentForm.amount} 
                                            onChange={e => setPaymentForm({...paymentForm, amount: e.target.value})} 
                                            className="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" 
                                            placeholder="أدخل المبلغ..."
                                        />
                                    </div>
                                    <div className="flex gap-3">
                                        <button type="submit" className="flex-1 py-2.5 rounded-xl text-white font-medium bg-emerald-600 hover:bg-emerald-700 transition">
                                            تأكيد التسديد
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* نافذة إعدادات GitHub */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                        <i className="ph-fill ph-github-logo text-gray-800"></i>
                                        إعدادات الحفظ السحابي
                                    </h3>
                                    <button onClick={() => setShowSettings(false)} className="text-gray-400 hover:text-gray-600">
                                        <i className="ph-bold ph-x text-xl"></i>
                                    </button>
                                </div>
                                
                                <div className="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm mb-5 flex gap-2">
                                    <i className="ph-fill ph-info text-xl shrink-0"></i>
                                    <p>أدخل بيانات مستودع GitHub الخاص بك ليتم حفظ واسترجاع البيانات تلقائياً كقاعدة بيانات. إذا تركتها فارغة، ستُحفظ البيانات في الذاكرة المؤقتة للمتصفح فقط.</p>
                                </div>

                                <form onSubmit={saveSettings} className="space-y-4">
                                    <div>
                                        <label className="block text-gray-700 font-medium mb-1 text-sm">GitHub Token (Classic/Fine-grained)</label>
                                        <input type="password" value={settings.token} onChange={e => setSettings({...settings, token: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-left" dir="ltr" placeholder="ghp_xxxxxxxxxxxx" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-medium mb-1 text-sm">اسم المستخدم (Owner)</label>
                                        <input type="text" value={settings.owner} onChange={e => setSettings({...settings, owner: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-left" dir="ltr" placeholder="username" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-medium mb-1 text-sm">اسم المستودع (Repository)</label>
                                        <input type="text" value={settings.repo} onChange={e => setSettings({...settings, repo: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-left" dir="ltr" placeholder="ashian-db" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-medium mb-1 text-sm">مسار الملف (File Path)</label>
                                        <input type="text" value={settings.path} onChange={e => setSettings({...settings, path: e.target.value})} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-left" dir="ltr" placeholder="data/ashian.json" />
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="submit" className="flex-1 bg-gray-900 hover:bg-black text-white py-2 rounded-lg transition font-medium flex justify-center items-center gap-2">
                                            {isSyncing ? <div className="loader w-4 h-4 border-t-white"></div> : 'حفظ ومزامنة'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* نافذة الرسائل العامة */}
                    <MessageBox {...msg} onClose={closeMessage} />

                </div>
            );
        };

        // Render React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
